name: Compila app (Android + PC)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    name: App Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Installa Capacitor
        run: npm install --no-audit --no-fund

      - name: Genera il progetto Android
        run: |
          npx cap add android
          bash scripts/prepare-android.sh
          npx cap sync android

      - name: Usa sempre la stessa firma (così gli aggiornamenti si installano sopra)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CollezioneFumetti.apk

      - uses: actions/upload-artifact@v7
        with:
          name: CollezioneFumetti-apk
          path: CollezioneFumetti.apk

      - name: Pubblica nella pagina Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Collezione Fumetti 1.1.${{ github.run_number }}
          body: Scarica CollezioneFumetti.apk dal telefono e aprilo per installare o aggiornare l'app.
          files: CollezioneFumetti.apk
          make_latest: true

  pc:
    name: Versione per PC (sito installabile)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v5
