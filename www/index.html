<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1a1f">
<title>Collezione Fumetti</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1>COLLEZIONE <span>FUMETTI</span></h1>
      <p>Riviste giapponesi, volumi, carte promo e allegati</p>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="st-items">–</b><small>pezzi</small></div>
      <div class="stat"><b id="st-vj">–</b><small>V Jump</small></div>
      <div class="stat"><b id="st-cards">–</b><small>carte promo</small></div>
      <div class="stat"><b id="st-check">–</b><small>carte verificate</small></div>
      <div class="stat"><b id="st-serie">–</b><small>volumi in serie</small></div>
      <div class="stat"><b id="st-wish">–</b><small>desiderati</small></div>
    </div>
  </div>
</header>

<div id="gate"></div>

<div id="app" hidden>
  <div class="toolbar">
    <div class="wrap">
      <div class="tabs" id="tabs" role="toolbar" aria-label="Filtra per testata"></div>
      <div class="search"><label for="q" class="sr">Cerca</label><input id="q" type="search" placeholder="Cerca titolo, carta, fumetto…"></div>
      <button class="btn" id="photo" type="button">📷 Da foto</button>
      <button class="btn primary" id="add" type="button">+ Aggiungi</button>
    </div>
  </div>
  <main class="wrap">
    <div class="viewbar">
      <h2 id="viewtitle">Tutta la collezione</h2>
      <div class="views" role="toolbar" aria-label="Vista">
        <button type="button" data-view="grid" aria-pressed="true">Copertine</button>
        <button type="button" data-view="years" aria-pressed="false">Annate V Jump</button>
      </div>
    </div>
    <div id="content"><p class="empty">Caricamento della collezione…</p></div>
    <div class="foot">
      <span class="sync"><span class="dot busy" id="dot"></span><span id="syncmsg">Collegamento…</span></span>
      <button class="btn ghost small" id="refresh" type="button">Aggiorna</button>
      <span class="grow"></span>
      <button class="btn ghost small" id="exp-json" type="button">Backup JSON</button>
      <button class="btn ghost small" id="exp-csv" type="button">CSV per Excel</button>
      <button class="btn ghost small" id="imp-json" type="button">Ripristina backup</button>
      <button class="btn ghost small" id="settings" type="button">Impostazioni</button>
      <button class="btn ghost small" id="logout" type="button">Esci</button>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-head">
    <button class="btn ghost small" id="close" type="button">← Chiudi</button>
    <span class="grow" id="sheet-title"></span>
    <button class="btn small" id="edit" type="button">Modifica</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</aside>
<input type="file" id="file" accept="image/*" class="sr" tabindex="-1">
<input type="file" id="file-photo" accept="image/*" capture="environment" class="sr" tabindex="-1">
<input type="file" id="file-json" accept="application/json,.json" class="sr" tabindex="-1">
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
